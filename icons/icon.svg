<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="128" height="128" rx="24" fill="url(#grad1)"/>
  
  <!-- Network/API icon design -->
  <!-- Central hub -->
  <circle cx="64" cy="64" r="12" fill="white"/>
  
  <!-- Connection lines -->
  <line x1="64" y1="64" x2="30" y2="30" stroke="white" stroke-width="3" opacity="0.8"/>
  <line x1="64" y1="64" x2="98" y2="30" stroke="white" stroke-width="3" opacity="0.8"/>
  <line x1="64" y1="64" x2="30" y2="98" stroke="white" stroke-width="3" opacity="0.8"/>
  <line x1="64" y1="64" x2="98" y2="98" stroke="white" stroke-width="3" opacity="0.8"/>
  
  <!-- Endpoint nodes -->
  <circle cx="30" cy="30" r="8" fill="white"/>
  <circle cx="98" cy="30" r="8" fill="white"/>
  <circle cx="30" cy="98" r="8" fill="white"/>
  <circle cx="98" cy="98" r="8" fill="white"/>
  
  <!-- Arrow indicating resend/replay -->
  <path d="M 75 55 L 85 55 L 80 50 M 85 55 L 80 60" stroke="#90caf9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
