<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Generate Extension Icons</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .canvas-container {
            display: flex;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        .canvas-wrapper {
            text-align: center;
        }
        canvas {
            border: 1px solid #ddd;
            border-radius: 4px;
            display: block;
            margin-bottom: 10px;
        }
        button {
            background: #4285f4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #3367d6;
        }
        .instructions {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            border-left: 4px solid #4285f4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 API Request Inspector - Icon Generator</h1>
        <p>Click the buttons below to download the extension icons in all required sizes.</p>
        
        <div class="canvas-container">
            <div class="canvas-wrapper">
                <canvas id="canvas16" width="16" height="16"></canvas>
                <button onclick="download(16)">Download icon16.png</button>
            </div>
            <div class="canvas-wrapper">
                <canvas id="canvas48" width="48" height="48"></canvas>
                <button onclick="download(48)">Download icon48.png</button>
            </div>
            <div class="canvas-wrapper">
                <canvas id="canvas128" width="128" height="128"></canvas>
                <button onclick="download(128)">Download icon128.png</button>
            </div>
        </div>

        <div class="instructions">
            <strong>Instructions:</strong>
            <ol>
                <li>Click each download button to save the icons</li>
                <li>Save them in the <code>extension/icons/</code> folder</li>
                <li>The manifest.json will automatically use these icons</li>
            </ol>
        </div>
    </div>

    <script>
        function drawIcon(canvas) {
            const ctx = canvas.getContext('2d');
            const size = canvas.width;
            const scale = size / 128;

            // Clear canvas
            ctx.clearRect(0, 0, size, size);

            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#4285f4');
            gradient.addColorStop(1, '#0d47a1');
            
            // Rounded rectangle
            const radius = 24 * scale;
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.roundRect(0, 0, size, size, radius);
            ctx.fill();

            // Central hub
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(size/2, size/2, 12 * scale, 0, Math.PI * 2);
            ctx.fill();

            // Connection lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 3 * scale;
            
            const center = size/2;
            const corner1 = 30 * scale;
            const corner2 = 98 * scale;

            ctx.beginPath();
            ctx.moveTo(center, center);
            ctx.lineTo(corner1, corner1);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(center, center);
            ctx.lineTo(corner2, corner1);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(center, center);
            ctx.lineTo(corner1, corner2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(center, center);
            ctx.lineTo(corner2, corner2);
            ctx.stroke();

            // Endpoint nodes
            ctx.fillStyle = 'white';
            const nodeRadius = 8 * scale;
            
            ctx.beginPath();
            ctx.arc(corner1, corner1, nodeRadius, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(corner2, corner1, nodeRadius, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(corner1, corner2, nodeRadius, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(corner2, corner2, nodeRadius, 0, Math.PI * 2);
            ctx.fill();

            // Arrow (resend indicator)
            ctx.strokeStyle = '#90caf9';
            ctx.lineWidth = 3 * scale;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const arrowX = 80 * scale;
            const arrowY = 55 * scale;
            const arrowSize = 10 * scale;

            ctx.beginPath();
            ctx.moveTo(arrowX - arrowSize, arrowY);
            ctx.lineTo(arrowX + arrowSize, arrowY);
            ctx.moveTo(arrowX + arrowSize, arrowY);
            ctx.lineTo(arrowX + arrowSize/2, arrowY - arrowSize/2);
            ctx.moveTo(arrowX + arrowSize, arrowY);
            ctx.lineTo(arrowX + arrowSize/2, arrowY + arrowSize/2);
            ctx.stroke();
        }

        // Draw all icons on page load
        window.onload = function() {
            drawIcon(document.getElementById('canvas16'));
            drawIcon(document.getElementById('canvas48'));
            drawIcon(document.getElementById('canvas128'));
        };

        function download(size) {
            const canvas = document.getElementById('canvas' + size);
            const link = document.createElement('a');
            link.download = 'icon' + size + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
